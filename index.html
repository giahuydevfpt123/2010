<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Chúc Mừng 20/10</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Nunito:wght@700;800;900&family=Comfortaa:wght@700&display=swap" rel="stylesheet">
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      width: 100vw;
      height: 100vh;
      overflow: hidden;
      background: #fdf0f4;
      font-family: 'Nunito', sans-serif;
      position: relative;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: space-between;
      padding: 3.5vh 5vw;
      color: #7c2d37;
      user-select: none;
    }

    /* Mảng màu bo góc trang trí nền */
    .bg-shape {
      position: absolute;
      border-radius: 50%;
      pointer-events: none;
      z-index: 1;
    }
    .shape-1 {
      width: 32vw;
      height: 32vw;
      background: #ffe3eb;
      top: -10vw;
      left: -8vw;
      filter: blur(40px);
    }
    .shape-2 {
      width: 35vw;
      height: 35vw;
      background: #ffd6e2;
      bottom: -12vw;
      right: -8vw;
      filter: blur(50px);
    }

    /* CÁC ICON HOẠT HÌNH DỄ THƯƠNG DI CHUYỂN */
    .doodle {
      position: absolute;
      z-index: 3;
      pointer-events: none;
    }

    /* Máy bay giấy lượn */
    .plane-anim {
      top: 12vh;
      right: 14vw;
      width: 4.8vw;
      animation: flyLoop 6s ease-in-out infinite alternate;
    }
    @keyframes flyLoop {
      0% { transform: translate(0, 0) rotate(0deg); }
      50% { transform: translate(15px, -18px) rotate(6deg); }
      100% { transform: translate(-10px, 12px) rotate(-4deg); }
    }

    /* Trái tim & Sao nhấp nháy bồng bềnh */
    .float-slow {
      animation: floatSmooth 4s ease-in-out infinite alternate;
    }
    .float-fast {
      animation: floatSmooth 2.8s ease-in-out infinite alternate-reverse;
    }
    .pulse-cute {
      animation: pulseCute 2.2s ease-in-out infinite;
    }

    @keyframes floatSmooth {
      0% { transform: translateY(0px) rotate(0deg); }
      100% { transform: translateY(-16px) rotate(8deg); }
    }
    @keyframes pulseCute {
      0%, 100% { transform: scale(1); }
      50% { transform: scale(1.15) rotate(-5deg); }
    }

    /* Cánh hoa rơi nhẹ */
    .falling-item {
      position: absolute;
      top: -10vh;
      z-index: 2;
      animation: fallDown linear infinite;
    }
    @keyframes fallDown {
      0% {
        top: -10vh;
        transform: translateX(0) rotate(0deg);
        opacity: 0.9;
      }
      100% {
        top: 105vh;
        transform: translateX(60px) rotate(360deg);
        opacity: 0.2;
      }
    }

    /* KHUNG NỘI DUNG CHÍNH */
    .content-layer {
      position: relative;
      z-index: 5;
      width: 100%;
      height: 100%;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: space-between;
    }

    /* TIÊU ĐỀ */
    .header {
      text-align: center;
    }
    .header h1 {
      font-size: 3.5vw;
      font-weight: 900;
      color: #9f2a3e;
      letter-spacing: 1.5px;
      line-height: 1.15;
      text-shadow: 2px 2px 0px #ffe1e9;
    }
    .header .sub-title {
      font-size: 1.45vw;
      font-weight: 800;
      color: #ba475a;
      letter-spacing: 2px;
      margin-top: 0.5vh;
    }

    /* 2 KHUNG ẢNH CÔ GIÁO DẠNG POLAROID DỄ THƯƠNG */
    .cards-wrapper {
      display: flex;
      justify-content: center;
      align-items: center;
      gap: 7vw;
      margin: auto 0;
    }

    .teacher-item {
      display: flex;
      flex-direction: column;
      align-items: center;
      position: relative;
    }

    .polaroid-frame {
      width: 17vw;
      height: 23vw;
      background: #ffffff;
      padding: 10px 10px 14px 10px;
      border-radius: 18px;
      border: 3.5px solid #6b2632;
      box-shadow: 6px 7px 0px rgba(107, 38, 50, 0.15);
      position: relative;
      background-color: #fff;
    }

    .polaroid-frame img {
      width: 100%;
      height: 100%;
      object-fit: cover;
      border-radius: 12px;
      display: block;
    }

    /* Sticker dính trên ảnh */
    .pin-sticker {
      position: absolute;
      z-index: 6;
      width: 2.6vw;
    }

    .teacher-name-box {
      margin-top: 1.6vh;
      background: #ffffff;
      border: 2.5px solid #6b2632;
      border-radius: 20px;
      padding: 6px 20px;
      font-size: 1.6vw;
      font-weight: 800;
      color: #7c2d37;
      box-shadow: 3px 3px 0px rgba(107, 38, 50, 0.12);
    }

    /* LỜI CHÚC & LỚP */
    .footer {
      text-align: center;
    }
    .wish-text {
      font-size: 1.45vw;
      font-weight: 800;
      color: #8c2a3b;
      margin-bottom: 0.6vh;
    }
    .class-tag {
      display: inline-block;
      font-size: 1.35vw;
      font-weight: 900;
      color: #fff;
      background: #ba475a;
      padding: 4px 18px;
      border-radius: 14px;
      letter-spacing: 1px;
    }
  </style>
</head>
<body>

  <!-- Nền hồng loang dịu -->
  <div class="bg-shape shape-1"></div>
  <div class="bg-shape shape-2"></div>

  <!-- CÁC HÌNH VẼ ĐỘNG DỄ THƯƠNG CHẠY XUNG QUANH -->
  
  <!-- Máy bay giấy -->
  <svg class="doodle plane-anim" viewBox="0 0 100 100" fill="none">
    <path d="M10 50 L85 15 L50 85 L42 55 Z" stroke="#6b2632" stroke-width="4" stroke-linejoin="round" fill="#fff"/>
    <path d="M42 55 L85 15" stroke="#6b2632" stroke-width="3"/>
    <path d="M10 65 Q 2 75 15 80 Q 25 82 22 70" stroke="#ba475a" stroke-width="2.5" stroke-dasharray="4,4" fill="none"/>
  </svg>

  <!-- Đám mây góc trái -->
  <svg class="doodle float-slow" style="top: 7vh; left: 8vw; width: 6vw;" viewBox="0 0 100 60" fill="#fff" stroke="#6b2632" stroke-width="3.5">
    <path d="M20 45 Q5 45 10 30 Q12 15 30 18 Q40 5 60 12 Q75 5 82 20 Q95 22 92 38 Q95 48 80 48 Z" />
  </svg>

  <!-- Trái tim đỏ nhỏ góc trái trên -->
  <svg class="doodle pulse-cute" style="top: 24vh; left: 12vw; width: 2.2vw;" viewBox="0 0 24 24" fill="#ff6b81" stroke="#6b2632" stroke-width="1.8">
    <path d="M12 21.35l-1.45-1.32C5.4 15.36 2 12.28 2 8.5 2 5.42 4.42 3 7.5 3c1.74 0 3.41.81 4.5 2.09C13.09 3.81 14.76 3 16.5 3 19.58 3 22 5.42 22 8.5c0 3.78-3.4 6.86-8.55 11.54L12 21.35z"/>
  </svg>

  <!-- Bông hoa dễ thương góc trái dưới -->
  <svg class="doodle float-fast" style="bottom: 12vh; left: 9vw; width: 4vw;" viewBox="0 0 100 100">
    <circle cx="50" cy="30" r="14" fill="#ffb7b2" stroke="#6b2632" stroke-width="3"/>
    <circle cx="70" cy="50" r="14" fill="#ffb7b2" stroke="#6b2632" stroke-width="3"/>
    <circle cx="50" cy="70" r="14" fill="#ffb7b2" stroke="#6b2632" stroke-width="3"/>
    <circle cx="30" cy="50" r="14" fill="#ffb7b2" stroke="#6b2632" stroke-width="3"/>
    <circle cx="50" cy="50" r="12" fill="#ffd166" stroke="#6b2632" stroke-width="3"/>
  </svg>

  <!-- Ngôi sao lấp lánh góc phải dưới -->
  <svg class="doodle pulse-cute" style="bottom: 16vh; right: 10vw; width: 3.2vw;" viewBox="0 0 100 100" fill="#ffd166" stroke="#6b2632" stroke-width="3.5">
    <polygon points="50,5 64,36 98,38 72,60 80,94 50,76 20,94 28,60 2,38 36,36" />
  </svg>

  <!-- Trái tim nhỏ bên cạnh khung ảnh phải -->
  <svg class="doodle float-slow" style="top: 48vh; right: 18vw; width: 2vw;" viewBox="0 0 24 24" fill="#ff8fa3" stroke="#6b2632" stroke-width="1.8">
    <path d="M12 21.35l-1.45-1.32C5.4 15.36 2 12.28 2 8.5 2 5.42 4.42 3 7.5 3c1.74 0 3.41.81 4.5 2.09C13.09 3.81 14.76 3 16.5 3 19.58 3 22 5.42 22 8.5c0 3.78-3.4 6.86-8.55 11.54L12 21.35z"/>
  </svg>

  <!-- CÁNH HOA TỰ ĐỘNG RƠI BẰNG JAVASCRIPT -->
  <div id="petals-container"></div>

  <!-- NỘI DUNG CHÍNH -->
  <div class="content-layer">

    <!-- TIÊU ĐỀ -->
    <div class="header">
      <h1>CHÚC MỪNG NGÀY 20/10</h1>
      <div class="sub-title">NGÀY PHỤ NỮ VIỆT NAM</div>
    </div>

    <!-- 2 KHUNG ẢNH VÀ TÊN 2 CÔ -->
    <div class="cards-wrapper">

      <!-- CÔ 1 -->
      <div class="teacher-item">
        <!-- Sticker nơ/hoa góc ảnh -->
        <svg class="pin-sticker" style="top: -12px; left: -12px;" viewBox="0 0 40 40">
          <circle cx="20" cy="20" r="14" fill="#ffd166" stroke="#6b2632" stroke-width="3"/>
          <circle cx="20" cy="20" r="6" fill="#ba475a"/>
        </svg>

        <div class="polaroid-frame">
          <!-- Thay ảnh cô 1 ở đây -->
          <img src="co_1.jpg" alt="Cô thứ nhất" onerror="this.src='https://i.ibb.co/NgqNXwt3/image.png'">
        </div>
        <!-- Thay tên cô 1 ở đây -->
        <div class="teacher-name-box">Cô Quỳnh</div>
      </div>

      <!-- CÔ 2 -->
      <div class="teacher-item">
        <!-- Sticker tim góc ảnh -->
        <svg class="pin-sticker pulse-cute" style="top: -12px; right: -12px;" viewBox="0 0 24 24" fill="#ff6b81" stroke="#6b2632" stroke-width="2">
          <path d="M12 21.35l-1.45-1.32C5.4 15.36 2 12.28 2 8.5 2 5.42 4.42 3 7.5 3c1.74 0 3.41.81 4.5 2.09C13.09 3.81 14.76 3 16.5 3 19.58 3 22 5.42 22 8.5c0 3.78-3.4 6.86-8.55 11.54L12 21.35z"/>
        </svg>

        <div class="polaroid-frame">
          <!-- Thay ảnh cô 2 ở đây -->
          <img src="co_2.jpg" alt="Cô thứ hai" onerror="this.src='https://i.ibb.co/nsGkDBbh/image.png'">
        </div>
        <!-- Thay tên cô 2 ở đây -->
        <div class="teacher-name-box">Cô Thúy</div>
      </div>

    </div>

  </div>

  <!-- SCRIPT TẠO CÁNH HOA RƠI NHẸ NHÀNG -->
  <script>
    const container = document.getElementById('petals-container');
    const colors = ['#ffccd5', '#ffb3c1', '#ffc2d1', '#ffe5ec'];

    for (let i = 0; i < 15; i++) {
      const petal = document.createElement('div');
      petal.className = 'falling-item';
      const size = Math.random() * 12 + 10;
      const left = Math.random() * 95;
      const duration = Math.random() * 5 + 6;
      const delay = Math.random() * 5;
      const color = colors[Math.floor(Math.random() * colors.length)];

      petal.style.left = left + 'vw';
      petal.style.width = size + 'px';
      petal.style.height = (size * 1.3) + 'px';
      petal.style.background = color;
      petal.style.borderRadius = '50% 0 50% 50%';
      petal.style.animationDuration = duration + 's';
      petal.style.animationDelay = delay + 's';

      container.appendChild(petal);
    }
  </script>
</body>
</html>
